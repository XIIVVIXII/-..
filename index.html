<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Time Town">
    <meta name="theme-color" content="#fff5f8">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/jdYx10Md/1a6a5c19f05ea142b51400d401e50794.jpg">
    <link rel="icon" href="https://i.postimg.cc/jdYx10Md/1a6a5c19f05ea142b51400d401e50794.jpg">

    <title>Time Town | Payment Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Itim', cursive; 
            background-color: #fff5f8; 
            touch-action: manipulation;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 3px solid #ffdeeb;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.2);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: popIn 0.3s ease-out; }
        
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes profileSway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        .profile-sway { animation: profileSway 3s infinite ease-in-out; }

        @keyframes dukdikAlways {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-4deg) scale(1.05); }
            75% { transform: rotate(4deg) scale(1.05); }
        }
        .dukdik-always {
            animation: dukdikAlways 1.8s infinite ease-in-out;
            display: inline-block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .text-3d { text-shadow: 2px 2px 0px #ffb6c1, 3px 3px 0px rgba(255, 182, 193, 0.2); }
        .text-3d-blue { text-shadow: 2px 2px 0px #bde0fe, 3px 3px 0px rgba(189, 224, 254, 0.3); }
        .text-3d-orange { text-shadow: 2px 2px 0px #ffe5d9, 3px 3px 0px rgba(255, 229, 217, 0.3); }

        .qr-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }
        .qr-zoom-img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 20px;
            border: 5px solid white;
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .qr-area { overflow: hidden; transition: all 0.4s ease-in-out; max-height: 0; opacity: 0; }
        .qr-area.show { max-height: 300px; opacity: 1; margin-top: 1rem; }

        .profile-window-frame {
            width: 85px;
            height: 100px;
            background: #fff;
            border: 3px solid #ffdeeb;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2);
            cursor: pointer;
            position: relative;
        }

        .profile-window-frame::after {
            content: "เปลี่ยนรูป";
            position: absolute;
            inset: 0;
            background: rgba(255, 133, 162, 0.85);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-weight: bold;
        }
        .profile-window-frame.ready-to-change::after {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" onclick="resetProfileFrame()">

    <div id="qr-overlay" class="qr-overlay" onclick="toggleZoom()">
        <img id="zoomed-qr" src="" class="qr-zoom-img">
    </div>

    <input type="file" id="profile-upload" accept="image/*" class="hidden" onchange="updateProfileImage(this)">

    <div class="w-full max-w-[360px] glass-card rounded-[3rem] p-6 text-center relative overflow-hidden">
        
        <div class="flex items-center justify-between mb-6 px-1">
            <div class="relative profile-sway">
                <div id="profile-frame" class="profile-window-frame" onclick="handleProfileClick(event)">
                    <img id="profile-img" src="https://i.postimg.cc/jdYx10Md/1a6a5c19f05ea142b51400d401e50794.jpg" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
            <div class="flex-1 text-right">
                <h1 class="text-3xl font-bold text-[#ff85a2] dukdik-always text-3d">โอนเลยค้าบ</h1>
            </div>
        </div>

        <div class="flex bg-[#fff0f5] p-1.5 rounded-2xl mb-6 border border-[#ffdeeb]">
            <button onclick="changeTab('bank', event)" id="btn-bank" class="tab-btn flex-1 py-3 text-base font-bold rounded-xl transition-all bg-[#ff85a2] text-white shadow-sm">ธนาคาร</button>
            <button onclick="changeTab('wallet', event)" id="btn-wallet" class="tab-btn flex-1 py-3 text-base font-bold rounded-xl transition-all text-pink-400">วอเลท</button>
        </div>

        <div id="bank" class="tab-content active space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border-2 border-[#ffdeeb] shadow-inner relative overflow-hidden flex flex-col items-center">
                <div class="dukdik-always mb-2" onclick="showQR('qr-bank-area', event)">
                    <img src="https://i.postimg.cc/4x6nN4Sg/roboneo-964433965718330.png" class="w-24 h-24">
                </div>
                <p class="text-[#00a1e0] font-bold text-lg text-3d-blue">ธนาคารกรุงไทย</p>
                <div class="text-2xl font-bold text-slate-700 text-3d-blue">7810-219-200</div>
                <p class="text-pink-400 font-bold text-lg mb-1">น.ส. นัฐมล เที่ยงโยธา</p>
                <div id="qr-bank-area" class="qr-area w-full border-t-2 border-dashed border-blue-100">
                    <img src="https://i.postimg.cc/j5jp9v7Q/IMG-20260413-234408.jpg" onclick="toggleZoom(this.src, event)" class="w-40 h-40 mx-auto mt-4 rounded-xl shadow-md cursor-pointer">
                </div>
            </div>
        </div>

        <div id="wallet" class="tab-content space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border-2 border-[#ffdeeb] shadow-inner relative overflow-hidden flex flex-col items-center">
                <div class="dukdik-always mb-2" onclick="showQR('qr-wallet-area', event)">
                    <img src="https://i.postimg.cc/sD3N0TCc/roboneo-964079165604232.png" class="w-24 h-24">
                </div>
                <p class="text-[#ff8500] font-bold text-lg text-3d-orange">TrueMoney Wallet</p>
                <div class="text-2xl font-bold text-slate-700 text-3d-orange">090-294-4904</div>
                <p class="text-pink-400 font-bold text-lg mb-1">น.ส. นัฐมล เที่ยงโยธา</p>
                <div id="qr-wallet-area" class="qr-area w-full border-t-2 border-dashed border-orange-100">
                    <img src="https://i.postimg.cc/qMxn7GF5/IMG-20260414-003442.png" onclick="toggleZoom(this.src, event)" class="w-40 h-40 mx-auto mt-4 rounded-xl shadow-md cursor-pointer">
                </div>
            </div>
        </div>

        <p class="mt-8 text-xl text-pink-300 font-bold">ขอขอบคุณงับ ✨🧸</p>
    </div>

    <script>
        let clickCount = 0;

        function handleProfileClick(event) {
            event.stopPropagation();
            clickCount++;
            const frame = document.getElementById('profile-frame');
            
            if (clickCount === 1) {
                frame.classList.add('ready-to-change');
            } else if (clickCount === 2) {
                document.getElementById('profile-upload').click();
                resetProfileFrame();
            }
        }

        function resetProfileFrame() {
            const frame = document.getElementById('profile-frame');
            if (frame.classList.contains('ready-to-change')) {
                frame.classList.remove('ready-to-change');
                clickCount = 0;
            }
        }

        function updateProfileImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById('profile-img').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function changeTab(id, event) {
            if(event) event.stopPropagation();
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.qr-area').forEach(el => el.classList.remove('show'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-[#ff85a2]', 'text-white', 'shadow-sm');
                btn.classList.add('text-pink-400');
            });
            document.getElementById('btn-' + id).classList.add('bg-[#ff85a2]', 'text-white', 'shadow-sm');
            resetProfileFrame();
        }

        function showQR(areaId, event) { 
            if(event) event.stopPropagation();
            document.getElementById(areaId).classList.toggle('show'); 
            resetProfileFrame();
        }

        function toggleZoom(src = null, event) {
            if(event) event.stopPropagation();
            const overlay = document.getElementById('qr-overlay');
            if (src) {
                document.getElementById('zoomed-qr').src = src;
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
            resetProfileFrame();
        }
    </script>
</body>
</html>
